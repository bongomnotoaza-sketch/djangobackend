<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>
</head>

<body>

    <h1>Create Account</h1>

    <form id="registration-form">

        {% csrf_token %}

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <input
            type="text"
            id="first_name"
            name="first_name"
            placeholder="First name"
            required
        >

        <br><br>

        <input
            type="text"
            id="last_name"
            name="last_name"
            placeholder="Last name"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Phone"
            required
        >

        <br><br>

        <label for="date_of_birth">
            Date of birth
        </label>

        <input
            type="date"
            id="date_of_birth"
            name="date_of_birth"
            required
        >

        <br><br>

        <input
            type="text"
            id="country"
            name="country"
            placeholder="Country"
            required
        >

        <br><br>

        <input
            type="text"
            id="province"
            name="province"
            placeholder="Province"
            required
        >

        <br><br>

        <input
            type="text"
            id="city"
            name="city"
            placeholder="City"
            required
        >

        <br><br>

        <input
            type="text"
            id="street"
            name="street"
            placeholder="Street"
            required
        >

        <br><br>

        <input
            type="text"
            id="current_activity"
            name="current_activity"
            placeholder="Current activity"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>


    <p id="message"></p>


    <script>

        async function registerUser() {

            const userData = {

                password:
                    document.getElementById("password").value,

                first_name:
                    document.getElementById("first_name").value,

                last_name:
                    document.getElementById("last_name").value,

                email:
                    document.getElementById("email").value,

                phone:
                    document.getElementById("phone").value,

                date_of_birth:
                    document.getElementById("date_of_birth").value,

                country:
                    document.getElementById("country").value,

                province:
                    document.getElementById("province").value,

                city:
                    document.getElementById("city").value,

                street:
                    document.getElementById("street").value,

                current_activity:
                    document.getElementById("current_activity").value
            };


            /*
             * Get the CSRF token generated by Django.
             */
            const csrfToken = document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;


            try {

                const response = await fetch(
                    "/auth/register/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",

                            "X-CSRFToken": csrfToken
                        },

                        credentials: "include",

                        body: JSON.stringify(userData)
                    }
                );


                const data = await response.json();


                console.log(
                    "Registration status:",
                    response.status
                );

                console.log(
                    "Registration response:",
                    data
                );


                if (response.ok) {

                    document.getElementById(
                        "message"
                    ).textContent = data.message;

                } else {

                    document.getElementById(
                        "message"
                    ).textContent =
                        data.error ||
                        "Registration failed.";
                }


            } catch (error) {

                console.error(
                    "Registration request failed:",
                    error
                );

                document.getElementById(
                    "message"
                ).textContent =
                    "Unable to connect to the server.";
            }
        }


        /*
         * Listen for the registration form submission.
         */
        document
            .getElementById("registration-form")
            .addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();

                    registerUser();
                }
            );

    </script>

</body>

</html>
