<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Reset Password</h1>

    <form id="passwordResetForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="temporary_password">
            Temporary Password
        </label>

        <input
            type="password"
            id="temporary_password"
            name="temporary_password"
            required
        >

        <label for="new_password">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            name="new_password"
            required
        >

        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <div id="status"></div>


    <script>

        // -----------------------------------------
        // Password reset (CSRF token removed)
        // -----------------------------------------

        document
            .getElementById("passwordResetForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const temporaryPassword =
                    document.getElementById(
                        "temporary_password"
                    ).value;

                const newPassword =
                    document.getElementById(
                        "new_password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirm_password"
                    ).value;

                const status =
                    document.getElementById("status");


                status.textContent =
                    "Resetting password...";


                try {

                    const response = await fetch(
                        "   https://www.logictree.co.za/auth/password-reset/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "same-origin",

                            body: JSON.stringify({
                                username: username,
                                temporary_password:
                                    temporaryPassword,
                                new_password:
                                    newPassword,
                                confirm_password:
                                    confirmPassword
                            })
                        }
                    );


                    const result =
                        await response.json();


                    console.log(
                        "Password reset status:",
                        response.status
                    );

                    console.log(
                        "Password reset response:",
                        result
                    );


                    if (response.ok) {

                        status.textContent =
                            result.message;

                        document
                            .getElementById(
                                "passwordResetForm"
                            )
                            .reset();

                    } else {

                        status.textContent =
                            result.error ||
                            "Unable to reset password.";
                    }

                } catch (error) {

                    console.error(
                        "Password reset failed:",
                        error
                    );

                    status.textContent =
                        "Unable to connect to the server.";
                }

            });

    </script>

</body>
</html>
